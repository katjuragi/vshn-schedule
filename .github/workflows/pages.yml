name: Расписание ВШН

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '32 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vshn-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Получить исходники
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Настроить GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Подготовить сайт
        run: |
          mkdir -p dist
          cp index.html dist/index.html
      - name: Загрузить расписание ВШН
        env:
          VSHN_PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 sync_schedule.py
      - name: Подготовить публикацию
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
      - name: Дождаться регистрации архива
        run: sleep 12
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
