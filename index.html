*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-width:300px}
button,input{font:inherit;color:inherit}
button,a,input{-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #267453;outline-offset:3px}
svg{display:block;width:19px;height:19px;flex:none}
.wrap{width:min(1192px,calc(100% - 80px));margin-inline:auto}
.top{background:#fbfcf8;border-bottom:1px solid var(--line)}
.top-inner{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:inline-flex;align-items:center;gap:11px;line-height:1.23}
.brand strong,.brand small{display:block}
.brand strong{font-size:1rem;font-weight:850;letter-spacing:.025em}
.brand small{margin-top:3px;font-size:.8rem;color:var(--muted);font-weight:650}
.brand-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--dark);color:var(--lime)}
.brand-icon svg{width:21px;height:21px}
.source-link,.data-card a{display:inline-flex;align-items:center;gap:7px;font-weight:750;color:var(--green);font-size:.875rem}
.source-link{border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:#fff;white-space:nowrap}
.source-link svg,.data-card a svg{width:15px;height:15px}
.source-link:hover,.data-card a:hover{color:#102c21}
.hero{isolation:isolate;position:relative;overflow:hidden;margin-top:27px;border-radius:26px;min-height:285px;background:radial-gradient(ellipse at 86% 38%,#315d49,var(--dark) 63%);color:#f8fcef}
.hero::before{content:"";z-index:-1;position:absolute;inset:0;background:linear-gradient(90deg,#12372f 3%,#12372f 26%,#12372f14 65%),var(--campus) right 51% / min(100%,1020px) auto no-repeat}
.hero-inner{padding:31px 42px 35px}
.hero-date{display:inline-flex;gap:7px;align-items:center;border:1px solid #b8d89950;border-radius:30px;padding:5px 11px;color:#e2efc7;font-size:.875rem;font-weight:700}
.hero-date svg{width:15px;height:15px}
.hero h1{font-size:clamp(3rem,5.8vw,5rem);line-height:.98;letter-spacing:-.075em;margin:15px 0 12px;font-weight:800}
.hero p{color:#dbe7d9;font-size:.925rem;line-height:1.5;margin:0}
.controls{display:flex;justify-content:space-between;gap:20px;margin:23px 0 27px;padding:16px 19px;background:var(--surface);border:1px solid var(--line);border-radius:17px}
.group{width:min(300px,100%);min-width:160px}
.controls label,.control-label{display:block;color:var(--muted);font-size:.83rem;font-weight:750;margin-bottom:6px}
.group-picker,.week-controls{display:flex;align-items:center;gap:6px}
.group-picker{position:relative;border:1px solid var(--line);border-radius:10px;min-height:42px;padding-left:11px;color:var(--green)}
.group-picker>span{display:grid;place-items:center}
.group-picker input{width:100%;min-width:0;background:transparent;border:0;outline:none!important;min-height:40px;font-weight:800;padding:0 1px 0 5px;color:var(--ink)}
.group-picker:focus-within{outline:2px solid #267453;outline-offset:2px}
.group-picker button{border:0;background:none;padding:10px;border-radius:9px}
#group-options{z-index:4;position:absolute;list-style:none;top:calc(100% + 7px);left:-1px;right:-1px;margin:0;padding:5px;max-height:245px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);box-shadow:0 12px 36px #17372821}
#group-options li{padding:8px 12px;border-radius:7px;cursor:pointer}
#group-options li:hover,#group-options [aria-selected=true]{background:#ebf4df;color:var(--dark)}
#group-options .no-option{cursor:default;color:var(--muted);font-size:.875rem}
.week-controls{gap:7px}
#week-label{min-width:178px;text-align:center;font-size:.925rem;font-weight:800;white-space:nowrap}
.icon-button,.today-button{display:grid;place-items:center;min-width:42px;min-height:42px;border:1px solid var(--line);border-radius:10px;background:#fff}
.icon-button:hover,.today-button:hover{background:#ebf4df}
.today-button{padding:0 13px;font-size:.875rem;font-weight:800;color:var(--green);margin-left:5px}
.dashboard{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px}
.section-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.section-top h2{margin:0;font-size:clamp(1.4rem,3vw,1.9rem);line-height:1.18;font-weight:800;letter-spacing:-.05em}
.views{padding:3px;display:flex;border:1px solid var(--line);border-radius:11px;background:#eaf0e5}
.views button{border:0;background:transparent;border-radius:8px;padding:7px 12px;font-size:.875rem;font-weight:750;color:var(--muted)}
.views button[aria-pressed=true]{background:#fff;color:var(--green);box-shadow:0 1px 3px #22452b15}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-bottom:15px}
.day{position:relative;min-height:68px;display:grid;align-content:center;justify-items:center;gap:2px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:.875rem;color:var(--muted);padding:5px 2px 9px}
.day strong{font-size:1.15rem;color:var(--ink);font-weight:800;line-height:1.13}
.day:hover{background:#edf4e4}
.day[aria-pressed=true]{background:var(--dark);border-color:var(--dark);color:#d9e8d7}
.day[aria-pressed=true] strong{color:#fff}
.day.busy::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:#579c68}
.day.busy[aria-pressed=true]::after{background:var(--lime)}
.day[aria-current=date]:not([aria-pressed=true]){border-color:#649674}
.lesson-stack{display:grid;gap:8px}
.lesson{display:grid;grid-template-columns:90px minmax(0,1fr) minmax(104px,22%);gap:13px;padding:13px 15px;border:1px solid var(--line);border-left:4px solid var(--accent,#728778);border-radius:12px;background:#fff}
.lesson.lecture{--accent:#7588ba;--tag:#e9eefc;--tag-text:#344d87}
.lesson.practice{--accent:#6e9c63;--tag:#e8f2dd;--tag-text:#355a2f}
.lesson.lab{--accent:#bd8656;--tag:#fbeddc;--tag-text:#774617}
.lesson.exam{--accent:#a875a7;--tag:#f3e8f4;--tag-text:#734777}
.lesson-time{display:grid;align-content:start;gap:2px;font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lesson-time span{white-space:nowrap}.lesson-time b{color:var(--ink);font-size:1.2rem;letter-spacing:-.045em;line-height:1.2}
.lesson-main,.room{min-width:0;overflow-wrap:anywhere}
.lesson h3{font-size:1rem;font-weight:800;margin:0;line-height:1.3}
.lesson .teacher,.note{color:var(--muted);font-size:.875rem;margin:4px 0 0;line-height:1.36}
.lesson .tag{display:inline-block;margin-top:7px;background:var(--tag,#eef1ec);color:var(--tag-text,var(--muted));padding:2px 7px;border-radius:5px;font-size:.78rem;font-weight:800}
.room{font-size:.875rem;display:grid;align-content:start;gap:3px;color:var(--muted)}
.room b{display:flex;align-items:flex-start;gap:4px;color:var(--ink);font-weight:800}
.room svg{width:15px;height:15px;margin-top:2px;color:var(--green)}
.day-heading{margin:17px 0 8px;font-size:1.02rem;font-weight:800}
.week-day:first-child .day-heading{margin-top:2px}
.side-card{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;margin-bottom:13px}
.upcoming{background:#e7efdc;border-color:#dce6d1}
.side-heading{display:flex;gap:8px;align-items:center}
.side-heading h2{margin:0;font-size:.925rem;font-weight:850}
.side-icon{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:#edf3e7;color:var(--green)}
.upcoming .side-icon{background:#d8e7c7}
.side-icon svg{width:16px;height:16px}
.side-card p{margin:8px 0 0;font-size:.875rem;line-height:1.45;color:var(--muted);overflow-wrap:anywhere}
.side-card .next-time{margin-top:13px;color:var(--green);font-weight:800}
.side-card .next-title{margin-top:4px;color:var(--ink);font-weight:850;font-size:1rem}
.data-card a{margin-top:11px;line-height:1.4}
.message{border:1px solid var(--line);border-radius:13px;background:#fff;padding:23px;font-size:.925rem;color:var(--muted);line-height:1.45}
.message b{display:block;color:var(--ink);font-size:1rem;margin-bottom:4px}
.message button{margin-top:12px;border:1px solid var(--line);background:#edf4e4;color:var(--green);padding:7px 10px;border-radius:8px;font-weight:800}
#schedule-message:empty{display:none}
#schedule-message:has(+ #lessons:not(:empty)){margin-bottom:10px}
.footer{border-top:1px solid var(--line);margin:30px auto 0;padding:17px 0 25px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.825rem;color:var(--muted)}
.footer span{display:inline-flex;align-items:center;gap:5px}
.footer svg{width:15px;height:15px}
@media(max-width:910px){.wrap{width:calc(100% - 46px)}.dashboard{grid-template-columns:minmax(0,1fr) 232px;gap:16px}.lesson{grid-template-columns:60px minmax(0,1fr) minmax(80px,22%);gap:9px;padding-inline:10px}}
@media(max-width:730px){.dashboard{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr;gap:10px}.side-card{margin-bottom:0}.hero::before{background-size:auto,820px auto;background-position:center,69% 49%}}
@media(max-width:540px){.wrap{width:calc(100% - 28px)}.top-inner{min-height:64px}.hero{min-height:238px;margin-top:14px;border-radius:18px}.hero-inner{padding:23px 18px}.hero::before{background-image:linear-gradient(90deg,#12372f 0%,#12372feb 23%,#12372f2a 100%),var(--campus);background-position:center,59% 48%;opacity:.9}.hero h1{font-size:3rem;margin:14px 0 9px}.hero p{font-size:.875rem}.controls{margin:13px 0 19px;display:grid;gap:13px;padding:12px}.group{width:100%}.week-controls{display:grid;grid-template-columns:42px minmax(0,1fr) 42px auto;gap:5px}#week-label{min-width:0;white-space:normal}.today-button{margin-left:2px}.days{gap:4px}.day{min-height:58px;border-radius:8px}.views button{padding-inline:8px}.lesson{grid-template-columns:54px minmax(0,1fr);padding:10px 9px;gap:7px 9px}.room{grid-column:2;gap:3px}.room small:empty{display:none}.sidebar{grid-template-columns:1fr}.footer{margin-top:20px}}

body{padding-bottom:var(--tg-content-safe-area-inset-bottom,0px)}
</style>
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="./" aria-label="АГТУ ВШН, расписание">
        <span class="brand-icon" data-icon="calendar"></span>
        <span><strong>АГТУ ВШН</strong><small>Высшая школа нефти</small></span>
      </a>
      <a class="source-link" href="https://qr.agni-rt.ru/schedule/" target="_blank" rel="noopener" data-tail="external"><span>Источник ВШН</span></a>
    </div>
  </header>
  <main class="wrap">
    <section class="hero" aria-labelledby="title">
      <div class="hero-inner">
        <div class="hero-date"><span data-icon="calendar"></span><time id="hero-date"></time></div>
        <h1 id="title">Расписание<br>занятий</h1>
        <p>Альметьевский государственный<br class="hero-break"> технологический университет</p>
      </div>
    </section>


    <section class="controls" aria-label="Выбор группы и недели">
      <div class="group">
        <label for="group">Учебная группа</label>
        <div class="group-picker" id="picker">
          <span data-icon="users"></span>
          <input id="group" role="combobox" type="text" autocomplete="off" spellcheck="false" aria-autocomplete="list" aria-expanded="false" aria-controls="group-options" placeholder="Найти группу">
          <button type="button" id="toggle-groups" aria-label="Показать список групп" data-icon="down"></button>
          <ul id="group-options" role="listbox" aria-label="Учебные группы" hidden></ul>
        </div>
      </div>
      <div class="week">
        <span class="control-label">Учебная неделя</span>
        <div class="week-controls">
          <button class="icon-button" id="previous" type="button" aria-label="Предыдущая неделя" data-icon="left"></button>
          <span id="week-label"></span>
          <button class="icon-button" id="next" type="button" aria-label="Следующая неделя" data-icon="right"></button>
          <button class="today-button" id="today" type="button">Сегодня</button>
        </div>
      </div>
    </section>

    <div class="dashboard">
      <section class="schedule" aria-labelledby="schedule-title">
        <div class="section-top">
          <h2 id="schedule-title"></h2>
          <div class="views" role="group" aria-label="Вид расписания">
            <button type="button" id="day-view" aria-pressed="true">День</button>
            <button type="button" id="week-view" aria-pressed="false">Неделя</button>
          </div>
        </div>
        <div class="days" id="days" role="group" aria-label="Дни недели"></div>
        <div id="schedule-message" role="status"></div>
        <div id="lessons" aria-busy="true"></div>
      </section>

      <aside class="sidebar" aria-label="Подробности">
        <section id="upcoming" class="side-card upcoming"></section>
        <section class="side-card data-card">
          <div class="side-heading"><span class="side-icon" data-icon="refresh"></span><h2>Данные расписания</h2></div>
          <p id="source-status" role="status">Подключаемся к расписанию ВШН…</p>
          <a id="official" href="https://qr.agni-rt.ru/schedule/" target="_blank" rel="noopener" data-tail="external">Открыть расписание ВШН</a>
        </section>
      </aside>
    </div>
  </main>
  <footer class="wrap footer"><span>Расписание АГТУ ВШН</span><span data-icon="clock">Московское время · UTC+3</span></footer>
  <script>const icons = {
  calendar: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18m-13 5h2m4 0h2"/>',
  users: '<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2m1-15a3 3 0 0 1 0 6m2 3a4 4 0 0 1 3 4v2"/>',
  external: '<path d="M13 5h6v6m0-6-9 9"/><path d="M19 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h4"/>',
  down: '<path d="m6 9 6 6 6-6"/>',
  left: '<path d="m15 18-6-6 6-6"/>',
  right: '<path d="m9 18 6-6-6-6"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-2 6m2-11v5h-5"/>',
  pin: '<path d="M19 10c0 5-7 10-7 10S5 15 5 10a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10" r="2"/>'
};
const icon = name => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]}</svg>`;
document.querySelectorAll('[data-icon]').forEach(el => el.insertAdjacentHTML('afterbegin', icon(el.dataset.icon)));
document.querySelectorAll('[data-tail]').forEach(el => el.insertAdjacentHTML('beforeend', icon(el.dataset.tail)));

const $ = id => document.getElementById(id);
const escape = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const asDate = iso => new Date(`${iso}T00:00:00Z`);
const formatDate = (iso, options) => asDate(iso).toLocaleDateString('ru-RU', {...options, timeZone:'UTC'});
const inMoscow = (locale, options) => new Intl.DateTimeFormat(locale, {timeZone:'Europe/Moscow', ...options}).format(new Date());
const todayIso = () => inMoscow('sv-SE', {year:'numeric', month:'2-digit', day:'2-digit'});
const titleCase = text => text.charAt(0).toUpperCase() + text.slice(1);
const validDate = iso => /^\d{4}-\d{2}-\d{2}$/.test(iso ?? '') && Number.isFinite(+asDate(iso)) && asDate(iso).toISOString().slice(0,10) === iso;
function addDays(iso, days) {
  const date = asDate(iso);
  date.setUTCDate(date.getUTCDate() + days);
  return date.toISOString().slice(0,10);
}
const startWeek = iso => addDays(iso, -((asDate(iso).getUTCDay() + 6) % 7));
const shortDate = iso => formatDate(iso, {day:'numeric', month:'long'});
const longDay = iso => titleCase(formatDate(iso, {weekday:'long', day:'numeric', month:'long'}));
function getSaved(key) {
  try { return JSON.parse(localStorage.getItem(`vshn:${key}`)); } catch { return null; }
}
function save(key, value) {
  try { localStorage.setItem(`vshn:${key}`, JSON.stringify(value)); } catch {}
}

const params = new URLSearchParams(location.search);
const sampleGroup = '15-11';
const validGroup = value => typeof value === 'string' && /^[\p{L}\p{N} .()–_-]{1,48}$/u.test(value);
const requestedGroup = params.get('group');
const savedGroup = getSaved('group');
let groups = [];
let group = validGroup(requestedGroup) ? requestedGroup : validGroup(savedGroup) ? savedGroup : sampleGroup;
let userChoseGroup = false;
let deviceStorage;
let day = validDate(params.get('date')) ? params.get('date') : todayIso();
let view = params.get('view') === 'week' ? 'week' : 'day';
let snapshot = null;
let data = null;
let sourceState = 'loading';
let requesting = false;
let loadFailed = false;
let matches = [];
let active = -1;
const input = $('group');
const options = $('group-options');
const groupButton = $('toggle-groups');
const official = 'https://qr.agni-rt.ru/schedule/';
const optionsId = index => `group-option-${index}`;
const normalize = value => value.toLocaleLowerCase('ru').replace(/[\s\-–—]/g,'');

function closePicker() {
  options.hidden = true;
  input.setAttribute('aria-expanded','false');
  input.removeAttribute('aria-activedescendant');
  groupButton.setAttribute('aria-label','Показать список групп');
  input.value = group;
  active = -1;
}
function showPicker(filter = '') {
  matches = groups.filter(item => normalize(item).includes(normalize(filter)));
  options.innerHTML = matches.length
    ? matches.map((item,index) => `<li id="${optionsId(index)}" data-index="${index}" role="option" aria-selected="false">${escape(item)}</li>`).join('')
    : '<li class="no-option" role="presentation">Группа не найдена</li>';
  options.hidden = false;
  input.setAttribute('aria-expanded','true');
  input.removeAttribute('aria-activedescendant');
  groupButton.setAttribute('aria-label','Скрыть список групп');
  active = -1;
}
function chooseGroup(value) {
  if (!value) return;
  const changed = group !== value;
  group = value;
  userChoseGroup = true;
  save('group',group);
  closePicker();
  if (changed) loadWeek();
  else updateUrl();
  deviceStorage?.setItem('schedule-group',group);
}
input.addEventListener('focus', () => input.select());
input.addEventListener('input', () => showPicker(input.value));
input.addEventListener('keydown', event => {
  if (event.key === 'Escape' && !options.hidden) {
    event.preventDefault();
    closePicker();
  }
  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    event.preventDefault();
    if (options.hidden) showPicker();
    if (!matches.length) return;
    if (active >= 0) $(optionsId(active)).setAttribute('aria-selected','false');
    const step = event.key === 'ArrowDown' ? 1 : -1;
    active = active < 0 && step < 0 ? matches.length - 1 : (active + step + matches.length) % matches.length;
    const option = $(optionsId(active));
    input.setAttribute('aria-activedescendant',option.id);
    option.setAttribute('aria-selected','true');
    option.scrollIntoView({block:'nearest'});
  }
  if (event.key === 'Enter' && !options.hidden) {
    event.preventDefault();
    chooseGroup(matches[active] || matches.find(item => normalize(item) === normalize(input.value)) || (matches.length === 1 ? matches[0] : null));
  }
});
input.addEventListener('click', () => { if (options.hidden) showPicker(); });
groupButton.addEventListener('click', () => {
  if (!options.hidden) return closePicker();
  input.focus();
  showPicker();
});
options.addEventListener('mousedown',event => event.preventDefault());
options.addEventListener('click', event => {
  const option = event.target.closest('[data-index]');
  if (option) chooseGroup(matches[Number(option.dataset.index)]);
});
$('picker').addEventListener('focusout', event => { if (!$('picker').contains(event.relatedTarget)) closePicker(); });
document.addEventListener('click', event => { if (!$('picker').contains(event.target) && !options.hidden) closePicker(); });

const shortType = {
  'лекции':['Лекция','lecture'], 'лекция':['Лекция','lecture'],
  'практические занятия':['Практика','practice'], 'практическое занятие':['Практика','practice'],
  'лабораторные работы':['Лабораторная','lab'], 'лабораторные занятия':['Лабораторная','lab'],
  'экзамен':['Экзамен','exam'], 'зачёт':['Зачёт','exam'], 'зачет':['Зачёт','exam']
};
function lessonCard(item) {
  const rawType = item.lesson_type?.trim();
  const [type, style] = shortType[rawType?.toLowerCase()] ?? [rawType || 'Занятие',''];
  const room = item.room?.match(/^\S+/)?.[0] ?? '';
  const roomLabel = /\d/.test(room) ? room : item.room;
  return `<article class="lesson ${style}">
    <div class="lesson-time"><b>${escape(item.start_time || '—')}</b>${item.end_time ? `<span>до ${escape(item.end_time)}</span>` : ''}${item.pair_number ? `<span>${escape(item.pair_number)} пара</span>` : ''}</div>
    <div class="lesson-main"><h3>${escape(item.discipline || 'Занятие')}</h3>
    ${item.teacher ? `<p class="teacher">${escape(item.teacher)}</p>` : ''}<span class="tag">${escape(type)}</span>
    ${item.note ? `<p class="note">${escape(item.note)}</p>` : ''}</div>
    ${roomLabel || item.address ? `<div class="room">${roomLabel ? `<b title="${escape(item.room)}">${icon('pin')}${escape(roomLabel)}</b>` : ''}${item.address ? `<small>${escape(item.address)}</small>` : ''}</div>` : ''}
  </article>`;
}
function upcoming(items, today, week) {
  const now = inMoscow('en-GB', {hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
  const selected = today >= week && today <= addDays(week,6);
  const current = selected && items.find(item => item.date === today && item.start_time && item.end_time && item.start_time <= now && item.end_time > now);
  const next = current || (selected && items.find(item => item.date > today || (item.date === today && item.start_time > now)));
  const status = !selected ? 'Откройте текущую неделю, чтобы увидеть ближайшие занятия.' : !data ? 'Ожидаем данные расписания группы.' : 'На этой неделе больше нет занятий.';
  $('upcoming').innerHTML = `<div class="side-heading"><span class="side-icon">${icon('clock')}</span><h2>${current ? 'Пара идёт сейчас' : 'Ближайшая пара'}</h2></div>
  ${next ? `<p class="next-time">${next.date === today ? 'Сегодня' : shortDate(next.date)} · ${escape(next.start_time)}${next.end_time ? `–${escape(next.end_time)}` : ''}</p>
  <p class="next-title">${escape(next.discipline || 'Занятие')}</p>${next.room ? `<p>${escape(next.room)}</p>` : ''}` : `<p>${status}</p>`}`;
}
function message(heading, detail = '', retry = false) {
  return `<div class="message"><b>${heading}</b>${detail}${retry ? '<br><button type="button" id="retry">Повторить загрузку</button>' : ''}</div>`;
}
function render() {
  const today = todayIso();
  const week = startWeek(day);
  const end = addDays(week,6);
  const time = $('hero-date');
  time.dateTime = today;
  time.textContent = longDay(today);
  const sameMonth = week.slice(0,7) === end.slice(0,7);
  $('week-label').textContent = sameMonth ? `${Number(week.slice(-2))}–${shortDate(end)}` : `${shortDate(week)} — ${shortDate(end)}`;
  $('schedule-title').textContent = view === 'week' ? 'Занятия на неделю' : day === today ? 'Занятия на сегодня' : longDay(day);
  $('day-view').setAttribute('aria-pressed',String(view === 'day'));
  $('week-view').setAttribute('aria-pressed',String(view === 'week'));
  $('official').href = official + '?' + new URLSearchParams({group, date:day, view});
  const items = (data?.items ?? []).slice().sort((a,b) => a.date.localeCompare(b.date) || (a.start_time || '').localeCompare(b.start_time || ''));
  const days = Array.from({length:7}, (_,index) => addDays(week,index));
  [...$('days').children].forEach((button,index) => {
    const iso = days[index];
    button.dataset.date = iso;
    button.classList.toggle('busy',items.some(item => item.date === iso));
    button.setAttribute('aria-label',longDay(iso));
    button.setAttribute('aria-pressed',String(view === 'day' && iso === day));
    if (iso === today) button.setAttribute('aria-current','date');
    else button.removeAttribute('aria-current');
    button.lastElementChild.textContent = Number(iso.slice(-2));
  });
  upcoming(items,today,week);

  const source = $('source-status');
  const stamp = data?.updated_at && new Date(data.updated_at);
  const when = stamp && Number.isFinite(+stamp) ? stamp.toLocaleString('ru-RU',{timeZone:'Europe/Moscow',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}) : '';
  if (sourceState === 'loading') source.textContent = data ? 'Показана копия. Проверяем обновления…' : 'Подключаемся к расписанию ВШН…';
  else if (sourceState === 'error') source.textContent = 'Связь с сайтом расписания временно недоступна.';
  else if (sourceState === 'missing') source.textContent = 'В опубликованных данных этой недели пока нет.';
  else if (sourceState === 'cached') source.textContent = when ? `Копия расписания от ${when} (МСК).` : 'Показана сохранённая копия расписания.';
  else source.textContent = when ? `ТАНДЕМ · обновлено ${when} (МСК).` : 'Данные из открытого расписания ВШН.';

  const list = $('lessons');
  const relevant = view === 'day' ? items.filter(item => item.date === day) : items;
  list.setAttribute('aria-busy',String(sourceState === 'loading'));
  let status = '';
  if (!data && sourceState === 'loading') status = message('Загружаем расписание…');
  if (sourceState === 'error') status = message('Не удалось загрузить расписание','Проверьте соединение или откройте расписание ВШН.',true);
  if (sourceState === 'missing') status = message('Расписание пока недоступно','Проверьте расписание ВШН для выбранной группы и даты.');
  if (sourceState === 'cached') status = message('Показана сохранённая копия','Актуальные изменения можно проверить в расписании ВШН.');
  if (data && !relevant.length) status = message(
    view === 'day' ? 'На этот день занятий нет' : 'На эту неделю занятий нет',
    sourceState === 'fresh' ? '' : 'По данным сохранённой копии.'
  );
  $('schedule-message').innerHTML = status;
  $('retry')?.addEventListener('click',refreshSchedule);
  if (view === 'day') list.innerHTML = `<div class="lesson-stack">${relevant.map(lessonCard).join('')}</div>`;
  else list.innerHTML = days.filter(iso => items.some(item => item.date === iso)).map(iso =>
    `<section class="week-day"><h3 class="day-heading">${longDay(iso)}</h3><div class="lesson-stack">${items.filter(item => item.date === iso).map(lessonCard).join('')}</div></section>`
  ).join('');
}
function updateUrl() {
  if (location.protocol === 'file:') return;
  const url = new URL(location.href);
  url.searchParams.set('date',day);
  url.searchParams.set('view',view);
  if (validGroup(requestedGroup) || userChoseGroup) url.searchParams.set('group',group);
  history.replaceState(null,'',url);
}
function loadWeek() {
  const entries = snapshot?.weeks?.[startWeek(day)];
  data = entries && Object.hasOwn(entries,group) ? entries[group] : null;
  if (data) {
    const olderThanTwoHours = Date.now() - Date.parse(data.updated_at) > 2 * 60 * 60 * 1000;
    sourceState = data.stale || olderThanTwoHours || loadFailed ? 'cached' : 'fresh';
  } else if (snapshot) sourceState = 'missing';
  else sourceState = loadFailed ? 'error' : 'loading';
  updateUrl();
  render();
}
async function refreshSchedule() {
  if (requesting) return;
  requesting = true;
  try {
    const response = await fetch('./schedule-data.json', {cache:'no-cache', signal:AbortSignal.timeout(12000)});
    if (!response.ok) throw new Error('Schedule data unavailable');
    const result = await response.json();
    if (!Array.isArray(result.groups) || !result.groups.length || !result.weeks) throw new Error('Invalid schedule data');
    snapshot = result;
    loadFailed = false;
    groups = [...result.groups].sort((a,b) => a.localeCompare(b,'ru',{numeric:true}));
    if (!groups.includes(group)) {
      group = groups.includes(sampleGroup) ? sampleGroup : groups[0];
      if (options.hidden) input.value = group;
    }
    if (!options.hidden) showPicker(input.value === group ? '' : input.value);
  } catch {
    loadFailed = true;
  } finally {
    requesting = false;
  }
  loadWeek();
}
function chooseDay(nextDay, nextView = view) {
  const changedWeek = startWeek(day) !== startWeek(nextDay);
  day = nextDay;
  view = nextView;
  if (changedWeek) loadWeek();
  else {
    updateUrl();
    render();
  }
}

$('days').innerHTML = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(label => `<button type="button" class="day"><span>${label}</span><strong></strong></button>`).join('');
$('days').addEventListener('click', event => {
  const button = event.target.closest('[data-date]');
  if (button) chooseDay(button.dataset.date,'day');
});
$('previous').addEventListener('click', () => chooseDay(addDays(day,-7)));
$('next').addEventListener('click', () => chooseDay(addDays(day,7)));
$('today').addEventListener('click', () => chooseDay(todayIso(),'day'));
$('day-view').addEventListener('click', () => chooseDay(day,'day'));
$('week-view').addEventListener('click', () => chooseDay(day,'week'));
closePicker();
loadWeek();
refreshSchedule();
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshSchedule(); });
setInterval(() => { if (!document.hidden) refreshSchedule(); },5 * 60 * 1000);
window.addEventListener('load', () => {
  const telegram = window.Telegram?.WebApp;
  telegram?.ready?.();
  telegram?.expand?.();
  if (!telegram?.initData || !telegram.isVersionAtLeast?.('9.0')) return;
  deviceStorage = telegram.DeviceStorage;
  if (userChoseGroup) {
    deviceStorage?.setItem('schedule-group',group);
  } else if (!validGroup(requestedGroup) && !validGroup(savedGroup)) {
    deviceStorage?.getItem('schedule-group', (error,value) => {
      if (error || userChoseGroup || !validGroup(value) || (groups.length && !groups.includes(value))) return;
      group = value;
      save('group',group);
      if (options.hidden) input.value = group;
      loadWeek();
    });
  }
});
</script>
</body>
</html>
